<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Merci — Exposé</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: max(env(safe-area-inset-top), 2rem) max(env(safe-area-inset-right), 2rem)
        max(env(safe-area-inset-bottom), 2rem) max(env(safe-area-inset-left), 2rem);
      background: #000;
      color: rgba(248, 250, 252, 0.92);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 2.5vw, 1.45rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      max-width: 24rem;
      line-height: 1.55;
      color: rgba(220, 228, 245, 0.78);
      font-size: clamp(0.9rem, 1.8vw, 1rem);
    }

    a {
      color: rgba(186, 214, 255, 0.95);
      text-decoration: none;
      border-bottom: 1px solid rgba(186, 214, 255, 0.35);
      font-size: 0.92rem;
    }

    a:hover,
    a:focus-visible {
      color: #fff;
      border-bottom-color: rgba(255, 255, 255, 0.55);
      outline: none;
    }
  </style>
</head>
<body>
  <h1>Merci pour votre écoute</h1>
  <p>Vous pouvez fermer cet onglet ou revenir à l’exposé.</p>
  <p><a href="index.html">Revoir la présentation</a></p>
</body>
</html>
