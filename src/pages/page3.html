<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Page 3 — Sphère aplatie</title>
  <link rel="stylesheet" href="../styles/ipad-text-scale.css" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #04050c;
      color: #f5f5f7;
      font-family: Inter, system-ui, sans-serif;
    }
    .page3-preview-note {
      position: fixed;
      top: max(env(safe-area-inset-top), 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      max-width: min(92vw, 36rem);
      padding: 0.5rem 0.85rem;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: clamp(0.75rem, 2vw, 0.88rem);
      line-height: 1.4;
      text-align: center;
    }
    .page3-preview-note a { color: #7ab8ff; }
    .iframe-wrap {
      position: fixed;
      inset: 0;
      background: #000;
    }
    .iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <p class="page3-preview-note">
    Aperçu <strong>étape 3</strong> — même fichier que l’exposé (<a href="../../index.html">index.html</a>) :
    1er swipe = sphère figée, 2e = lancement de l’aplatissement.
  </p>
  <div class="iframe-wrap">
    <iframe
      id="sphere-aplatie-preview"
      title="Sphère → sphéroïde oblate"
      src="../../docs/prompts/sph%C3%A8re%20aplatie.html"
      scrolling="no"
    ></iframe>
  </div>
  <script>
    (function () {
      const f = document.getElementById("sphere-aplatie-preview");
      if (!(f instanceof HTMLIFrameElement)) return;
      f.addEventListener("load", function () {
        window.setTimeout(function () {
          const targetOrigin = window.location.origin && window.location.origin !== "null" ? window.location.origin : "*";
          try { f.contentWindow?.postMessage("play", targetOrigin); } catch (e) { if (import.meta.env?.DEV) console.warn(e); }
        }, 600);
      }, { once: true });
    })();
  </script>
</body>
</html>
