const earthTex = new THREE.Texture(texImg);
earthTex.colorSpace = THREE.SRGBColorSpace;
texImg.onload = () => { earthTex.needsUpdate = true; };

/* Globe — SphereGeometry standard, UV parfaits garantis */
const globe = new THREE.Mesh(
  new THREE.SphereGeometry(1, 64, 64),
  new THREE.MeshPhongMaterial({
    map:       earthTex,
    specular:  new THREE.Color(0x1a3355),
    shininess: 18,
  })
);
scene.add(globe);

/* Atmosphère */
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(1.03, 48, 48),
  new THREE.MeshPhongMaterial({
    color:0x4499ff, transparent:true,
    opacity:0.09, side:THREE.BackSide
  })
));

/* Caméra orbitale — 1 tour en 4s (~60 fps) */
let angle = 0;
let paused = false;
let speed  = 1.0;
const TILT       = 0.22;
const RADIUS     = 3.2;
const BASE_SPEED = (2*Math.PI)/(4*60);

function animate(){
  requestAnimationFrame(animate);
  if(!paused){
    angle += BASE_SPEED * speed;
    camera.position.set(
      RADIUS * Math.sin(angle),
      RADIUS * Math.sin(TILT),
      RADIUS * Math.cos(angle)
    );
    camera.lookAt(0,0,0);
  }
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

window.EarthOrbit = {
  setSpeed: s  => { speed  = s;     },
  pause:    ()  => { paused = true;  },
  resume:   ()  => { paused = false; },
};
</script>
