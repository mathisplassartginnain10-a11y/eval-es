<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Anim partie 3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    font-family: Inter, system-ui, sans-serif;
    color: #FFFFFF;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
  }
  #c {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }
  #ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }
  .caption {
    position: absolute;
    left: 50%;
    transform: translate(-50%, 12px);
    bottom: 12%;
    max-width: 92vw;
    text-align: center;
    font-size: clamp(13px, 2.8vw, 18px);
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    line-height: 1.45;
    opacity: 0;
    transition: opacity 1.1s ease, transform 1.1s ease;
    text-shadow: 0 0 24px rgba(0,0,0,.85), 0 0 8px rgba(74,158,255,.25);
  }
  .caption.visible {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  #formulaWrap {
    position: absolute;
    left: 50%;
    top: 18%;
    transform: translate(-50%, 0);
    opacity: 0;
    transition: opacity 1.4s ease, transform 1.4s ease;
    text-align: center;
    white-space: nowrap;
  }
  #formulaWrap.visible {
    opacity: 1;
    transform: translate(-50%, -4px);
  }
  #formulaWrap .math {
    font-size: clamp(15px, 3.6vw, 26px);
    font-weight: 500;
    letter-spacing: 0.06em;
    color: #FFFFFF;
    text-shadow:
      0 0 20px rgba(255,255,255,.35),
      0 0 40px rgba(74,158,255,.45),
      0 0 2px rgba(78,205,196,.5);
  }
  #formulaWrap .sub {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,.45);
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="ui">
    <div id="formulaWrap" aria-hidden="true">
      <div class="math">U(r) = −G ( Mm / r )</div>
      <div class="sub">Énergie potentielle gravitationnelle</div>
    </div>
    <div id="cap1" class="caption">Au départ, la matière est dispersée.</div>
    <div id="cap2" class="caption">La gravité attire toute la matière vers un centre commun.</div>
    <div id="cap3" class="caption">La sphère devient la forme la plus stable.</div>
    <div id="cap4" class="caption">Ce phénomène est appelé équilibre hydrostatique.</div>
    <div id="cap5" class="caption">Aucune planète réelle n’est parfaitement sphérique.</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════════════
   Constantes scène / performance (iPad Safari, iframe)
   ═══════════════════════════════════════════════════════════════════ */
const TOTAL_DURATION = 25;
const FPS_CAP_MS = 1000 / 30;
const FRAGMENT_COUNT = 200;

const COL = {
  white: 0xffffff,
  blue: 0x4a9eff,
  turquoise: 0x4ecdc4,
  gold: 0xffd700,
};

/* ═══════════════════════════════════════════════════════════════════
   Utils
   ═══════════════════════════════════════════════════════════════════ */
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function smoothstep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
  return t * t * (3 - 2 * t);
}
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/* ═══════════════════════════════════════════════════════════════════
   État global animation
   ═══════════════════════════════════════════════════════════════════ */
let canvas, renderer, scene, camera;
let stars, fragmentMesh, mainSphere, haloMesh;
let fragPositions = [];      // Vector3[] courant monde
let fragVelocities = [];     // Vector3[] pour inertie / courbure
let fragRotSpeed = [];       // axe + vitesse
let fragScales = [];         // échelle par instance (stable)
/** Instantané au début d’un « play » — pour seek() cohérent */
let fragmentSnapshot = null;
let clock = new THREE.Clock();

let timelineT = 0;           // secondes [0, TOTAL_DURATION]
let playing = false;
let paused = false;
let rafId = 0;
let lastRenderWall = 0;

/* ═══════════════════════════════════════════════════════════════════
   Init Three.js
   ═══════════════════════════════════════════════════════════════════ */
function initThree() {
  if (renderer) return;
  canvas = document.getElementById('c');
  renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: false,
    powerPreference: 'low-power',
    alpha: false,
  });
  renderer.setPixelRatio(1);
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setClearColor(0x000000, 1);
  renderer.shadowMap.enabled = false;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 120);
  camera.position.set(0, 1.2, 11.5);

  /* Lumières douces (pas d’ombres) */
  const amb = new THREE.AmbientLight(0x334455, 0.55);
  scene.add(amb);
  const key = new THREE.DirectionalLight(COL.white, 0.85);
  key.position.set(4, 6, 8);
  scene.add(key);
  const rim = new THREE.DirectionalLight(COL.turquoise, 0.35);
  rim.position.set(-6, -2, -4);
  scene.add(rim);

  /* Étoiles — Points, très léger */
  {
    const N = 900;
    const pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const r = 40 + Math.random() * 55;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
      pos[i * 3 + 1] = r * Math.cos(ph);
      pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      color: 0x8899aa,
      size: 0.045,
      transparent: true,
      opacity: 0.55,
      depthWrite: false,
    });
    stars = new THREE.Points(geo, mat);
    scene.add(stars);
  }

  /* Fragments — InstancedMesh low poly */
  {
    const baseGeo = new THREE.TetrahedronGeometry(0.22, 0);
    const mat = new THREE.MeshStandardMaterial({
      color: 0x8a93a0,
      metalness: 0.15,
      roughness: 0.82,
      flatShading: true,
      emissive: new THREE.Color(0x0a0f18),
      emissiveIntensity: 0.25,
    });
    fragmentMesh = new THREE.InstancedMesh(baseGeo, mat, FRAGMENT_COUNT);
    fragmentMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(fragmentMesh);

    const dummy = new THREE.Object3D();
    for (let i = 0; i < FRAGMENT_COUNT; i++) {
      const r = 2.2 + Math.random() * 3.2;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      const p = new THREE.Vector3(
        r * Math.sin(ph) * Math.cos(th),
        r * Math.cos(ph) * 0.85 + (Math.random() - 0.5) * 0.6,
        r * Math.sin(ph) * Math.sin(th)
      );
      fragPositions.push(p);
      fragVelocities.push(new THREE.Vector3(
        (Math.random() - 0.5) * 0.012,
        (Math.random() - 0.5) * 0.012,
        (Math.random() - 0.5) * 0.012
      ));
      fragRotSpeed.push({
        ax: new THREE.Vector3(Math.random(), Math.random(), Math.random()).normalize(),
        sp: 0.4 + Math.random() * 0.9,
      });
      const s = 0.45 + Math.random() * 1.35;
      fragScales.push(s);
      dummy.position.copy(p);
      dummy.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
      dummy.scale.setScalar(s);
      dummy.updateMatrix();
      fragmentMesh.setMatrixAt(i, dummy.matrix);
    }
    fragmentMesh.instanceMatrix.needsUpdate = true;
  }

  /* Sphère centrale (cachée au début) — détail mis à jour selon timeline */
  {
    const geo = new THREE.IcosahedronGeometry(1.05, 0);
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(0xc8d0dc),
      metalness: 0.22,
      roughness: 0.38,
      emissive: new THREE.Color(COL.blue),
      emissiveIntensity: 0.08,
    });
    mainSphere = new THREE.Mesh(geo, mat);
    mainSphere.visible = false;
    mainSphere.scale.setScalar(0.01);
    scene.add(mainSphere);

    const haloGeo = new THREE.IcosahedronGeometry(1.12, 2);
    const haloMat = new THREE.MeshBasicMaterial({
      color: COL.blue,
      transparent: true,
      opacity: 0,
      side: THREE.BackSide,
      depthWrite: false,
    });
    haloMesh = new THREE.Mesh(haloGeo, haloMat);
    haloMesh.visible = false;
    scene.add(haloMesh);
  }

  window.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', onVisibility);
}

function onResize() {
  if (!renderer || !camera) return;
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}

function onVisibility() {
  if (document.hidden) paused = true;
}

function disposeSphereGeometry() {
  if (mainSphere.geometry) mainSphere.geometry.dispose();
}

function setIcosaDetail(detail) {
  disposeSphereGeometry();
  mainSphere.geometry = new THREE.IcosahedronGeometry(1.05, detail);
}

/* ═══════════════════════════════════════════════════════════════════
   Timeline → états visuels + physique fragments
   ═══════════════════════════════════════════════════════════════════ */
const tmpV = new THREE.Vector3();
const tmpV2 = new THREE.Vector3();
const dummy = new THREE.Object3D();

function gravityPhaseStrength(t) {
  /* ~5.5 → 16 : montée puis plateau */
  if (t < 5.5) return 0;
  if (t < 8) return smoothstep(5.5, 8, t);
  if (t < 14) return 1;
  return Math.max(0, 1 - smoothstep(14, 17, t));
}

function clusterToSphereProgress(t) {
  /* 0 → 1 entre ~7 et ~16 */
  return smoothstep(7, 16, t);
}

function sphereOpacityProgress(t) {
  return smoothstep(12.5, 16.5, t);
}

function oblateAmount(t) {
  /* léger aplatissement pôles à partir de ~21.5 */
  return smoothstep(21.5, 24.5, t) * 0.045;
}

function applyVisualsFromTimeline(t) {
  /* UI : phase 1 */
  const cap1 = document.getElementById('cap1');
  const cap2 = document.getElementById('cap2');
  const cap3 = document.getElementById('cap3');
  const cap4 = document.getElementById('cap4');
  const cap5 = document.getElementById('cap5');
  const formulaWrap = document.getElementById('formulaWrap');

  [cap1, cap2, cap3, cap4, cap5].forEach((el) => el.classList.remove('visible'));
  formulaWrap.classList.remove('visible');

  if (t < 4.5) cap1.classList.add('visible');
  if (t >= 3.8) formulaWrap.classList.add('visible');

  if (t >= 14 && t < 17.5) cap2.classList.add('visible');
  if (t >= 17 && t < 20) cap3.classList.add('visible');
  if (t >= 19.5 && t < 22.5) cap4.classList.add('visible');
  if (t >= 22) cap5.classList.add('visible');

  /* Opacité formulaire (fade lent) */
  formulaWrap.style.opacity = t < 3.5 ? '0' : String(smoothstep(3.5, 6, t) * (t < 18 ? 1 : 1 - smoothstep(18, 20, t)));

  /* Détail icosaèdre */
  let detail = 0;
  if (t >= 15.2) detail = 1;
  if (t >= 17) detail = 2;
  if (t >= 19) detail = 4;
  if (mainSphere.userData.lastDetail !== detail) {
    setIcosaDetail(detail);
    mainSphere.userData.lastDetail = detail;
    if (haloMesh.geometry) haloMesh.geometry.dispose();
    haloMesh.geometry = new THREE.IcosahedronGeometry(1.12 + detail * 0.02, Math.min(detail + 1, 3));
  }

  const sProg = sphereOpacityProgress(t);
  const showSphere = t >= 12.8;
  mainSphere.visible = showSphere;
  haloMesh.visible = showSphere;

  const baseScale = showSphere ? THREE.MathUtils.lerp(0.02, 1, easeOutCubic(sProg)) : 0.01;
  const obl = oblateAmount(t);
  /* Aplatissement aux pôles (Y = axe « vertical » scène) : équateur élargi */
  mainSphere.scale.set(baseScale * (1 + obl), baseScale * (1 - obl * 1.8), baseScale * (1 + obl));
  haloMesh.scale.copy(mainSphere.scale).multiplyScalar(1.04);

  const mat = mainSphere.material;
  mat.emissiveIntensity = THREE.MathUtils.lerp(0.06, 0.22, sProg);
  haloMesh.material.opacity = showSphere ? THREE.MathUtils.lerp(0, 0.14, sProg) * (1 - smoothstep(23, 25, t) * 0.3) : 0;

  /* Visibilité fragments (matrices mises à jour dans updateFragmentsPhysics uniquement) */
  const fragVis = 1 - smoothstep(13, 16.5, t);
  fragmentMesh.visible = fragVis > 0.02;

  /* Rotation majestueuse sphère */
  if (mainSphere.visible) {
    mainSphere.rotation.y = t * 0.11;
    mainSphere.rotation.x = Math.sin(t * 0.07) * 0.06;
    haloMesh.rotation.copy(mainSphere.rotation);
  }
}

function updateFragmentsPhysics(dt, t) {
  const gStr = gravityPhaseStrength(t);
  const mergeP = clusterToSphereProgress(t);
  const center = tmpV2.set(0, 0, 0);

  const dummyObj = dummy;
  for (let i = 0; i < FRAGMENT_COUNT; i++) {
    const p = fragPositions[i];
    const v = fragVelocities[i];
    const rs = fragRotSpeed[i];

    /* Flottement lent phase début */
    if (gStr < 0.05) {
      v.x += (Math.random() - 0.5) * 0.0001;
      v.y += (Math.random() - 0.5) * 0.0001;
      v.z += (Math.random() - 0.5) * 0.0001;
      v.multiplyScalar(0.985);
    }

    /* Attraction gravitationnelle stylisée + légère déviation (trajectoire courbe) */
    if (gStr > 0) {
      tmpV.copy(center).sub(p);
      const dist = Math.max(tmpV.length(), 0.35);
      tmpV.normalize();
      const pull = (0.022 + 0.055 * gStr) / (dist * dist) * dt * 60;
      /* composante orthogonale pour courber (évite vecteur nul si tmpV // Y) */
      let cx = -tmpV.z;
      let cz = tmpV.x;
      let lenC = Math.hypot(cx, cz);
      if (lenC < 1e-5) {
        cx = 1;
        cz = 0;
        lenC = 1;
      }
      tmpV2.set(cx / lenC, 0, cz / lenC).multiplyScalar(0.008 * gStr * Math.sin(t * 0.7 + i));
      v.addScaledVector(tmpV, pull * (0.35 + mergeP * 0.65));
      v.add(tmpV2);
      v.multiplyScalar(THREE.MathUtils.lerp(1, 0.988, mergeP));
    }

    p.add(v);

    /* Sphère de confinement qui rétrécit */
    const targetR = THREE.MathUtils.lerp(4.2, 1.25, easeInOutCubic(mergeP));
    const len = p.length();
    if (len > targetR + 0.01) {
      p.multiplyScalar(targetR / len);
    }

    /* Matrice instance : rotation */
    dummyObj.position.copy(p);
    dummyObj.quaternion.setFromAxisAngle(rs.ax, t * rs.sp + i * 0.2);
    const fragVis = 1 - smoothstep(13, 16.5, t);
    const sc = fragScales[i] * (fragVis < 1 ? (0.25 + 0.75 * fragVis) : 1);
    dummyObj.scale.setScalar(sc);
    dummyObj.updateMatrix();
    fragmentMesh.setMatrixAt(i, dummyObj.matrix);
  }
  fragmentMesh.instanceMatrix.needsUpdate = true;
}

function updateCamera(t) {
  /* Orbite lente stable */
  const ang = t * 0.09;
  const rad = 11.5;
  camera.position.x = Math.sin(ang) * rad * 0.95;
  camera.position.z = Math.cos(ang) * rad;
  camera.position.y = 1.2 + Math.sin(ang * 0.5) * 0.35;
  camera.lookAt(0, 0, 0);
}

function updateStars(t) {
  stars.rotation.y = t * 0.012;
  stars.rotation.x = t * 0.004;
}

/* ═══════════════════════════════════════════════════════════════════
   Boucle rendu 30 fps max
   ═══════════════════════════════════════════════════════════════════ */
function tick(now) {
  if (document.hidden || paused || !playing) {
    rafId = 0;
    return;
  }

  if (now - lastRenderWall < FPS_CAP_MS) {
    rafId = requestAnimationFrame(tick);
    return;
  }
  lastRenderWall = now;

  const dt = Math.min(clock.getDelta(), 0.05);

  if (timelineT < TOTAL_DURATION) {
    timelineT += dt;
    if (timelineT > TOTAL_DURATION) timelineT = TOTAL_DURATION;
  }

  updateStars(timelineT);
  updateCamera(timelineT);
  updateFragmentsPhysics(dt, timelineT);
  applyVisualsFromTimeline(timelineT);

  renderer.render(scene, camera);

  if (timelineT >= TOTAL_DURATION && playing) {
    playing = false;
    rafId = 0;
    return;
  }

  rafId = requestAnimationFrame(tick);
}

/* ═══════════════════════════════════════════════════════════════════
   API publique
   ═══════════════════════════════════════════════════════════════════ */
function playAnimation() {
  if (!renderer) initThree();
  if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = 0;
  }
  paused = false;
  playing = true;
  clock.start();
  lastRenderWall = performance.now();
  rafId = requestAnimationFrame(tick);
}

function resetAnimation() {
  if (rafId) {
    cancelAnimationFrame(rafId);
    rafId = 0;
  }
  paused = false;
  playing = false;
  timelineT = 0;
  clock.stop();
  clock = new THREE.Clock();

  if (fragmentMesh) {
    fragScales.length = 0;
    for (let i = 0; i < FRAGMENT_COUNT; i++) {
      const r = 2.2 + Math.random() * 3.2;
      const th = Math.random() * Math.PI * 2;
      const ph = Math.acos(2 * Math.random() - 1);
      fragPositions[i].set(
        r * Math.sin(ph) * Math.cos(th),
        r * Math.cos(ph) * 0.85 + (Math.random() - 0.5) * 0.6,
        r * Math.sin(ph) * Math.sin(th)
      );
      fragVelocities[i].set(
        (Math.random() - 0.5) * 0.012,
        (Math.random() - 0.5) * 0.012,
        (Math.random() - 0.5) * 0.012
      );
      fragScales[i] = 0.45 + Math.random() * 1.35;
    }
    fragmentMesh.visible = true;
  }
  if (mainSphere) {
    mainSphere.userData.lastDetail = undefined;
    setIcosaDetail(0);
    mainSphere.visible = false;
    mainSphere.scale.setScalar(0.01);
  }
  if (haloMesh) {
    haloMesh.visible = false;
    haloMesh.material.opacity = 0;
  }

  applyVisualsFromTimeline(0);
  if (renderer && camera) renderer.render(scene, camera);
  saveFragmentSnapshot();
}

function saveFragmentSnapshot() {
  fragmentSnapshot = {
    pos: fragPositions.map((p) => p.clone()),
    vel: fragVelocities.map((v) => v.clone()),
  };
}

function restoreFragmentSnapshot() {
  if (!fragmentSnapshot) return;
  for (let i = 0; i < FRAGMENT_COUNT; i++) {
    fragPositions[i].copy(fragmentSnapshot.pos[i]);
    fragVelocities[i].copy(fragmentSnapshot.vel[i]);
  }
}

/** Recalcule l’état à l’instant t (pour seek) en rejouant la physique depuis t=0 */
function seekAnimation(sec) {
  if (!renderer) initThree();
  const target = clamp(Number(sec) || 0, 0, TOTAL_DURATION);
  restoreFragmentSnapshot();
  timelineT = 0;
  const step = 0.02;
  while (timelineT + step < target) {
    updateFragmentsPhysics(step, timelineT);
    timelineT += step;
  }
  const rem = target - timelineT;
  if (rem > 1e-5) updateFragmentsPhysics(rem, timelineT);
  timelineT = target;
  if (mainSphere) mainSphere.userData.lastDetail = undefined;
  updateStars(timelineT);
  updateCamera(timelineT);
  applyVisualsFromTimeline(timelineT);
  renderer.render(scene, camera);
}

window.GravitySphereAnim = {
  play() {
    resetAnimation();
    playAnimation();
  },
  reset() {
    resetAnimation();
    if (renderer && camera) renderer.render(scene, camera);
  },
  pause() {
    paused = true;
  },
  resume() {
    paused = false;
    if (playing && !rafId) rafId = requestAnimationFrame(tick);
  },
  seek(t) {
    seekAnimation(t);
  },
  isPlaying() {
    return playing && !paused && timelineT < TOTAL_DURATION;
  },
};

window.addEventListener('message', (e) => {
  if (e.data === 'play') window.GravitySphereAnim.play();
  if (e.data === 'pause') window.GravitySphereAnim.pause();
  if (e.data === 'resume') window.GravitySphereAnim.resume();
  if (e.data === 'reset') window.GravitySphereAnim.reset();
});

/* Premier rendu statique (iframe figée jusqu’à « play ») */
initThree();
resetAnimation();
</script>
</body>
</html>
