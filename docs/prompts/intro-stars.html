<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intro</title>
<!--
================================================================
GUIDE CURSOR — intro-stars.html
================================================================
SÉQUENCE : warp → noms → titre → idle (hint « Appuyer »).

Messages postMessage vers la page parente (index / main.js) :
  • "intro-complete" — idle atteint, prêt pour le tap (le parent charge les 3 globes, etc.).
  • "intro-tap"      — interaction utilisateur après idle (ou accélération avant) ; le parent appelle exitIntro().

La page parente appelle encore IntroStars.exit() pour le fondu de sortie.
API : .exit()  .onComplete(fn)  .getSeedPositions()
================================================================
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* Noms */
#intro-names{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:2;pointer-events:none;
  opacity:0;
}
#label-by{
  font-size:clamp(11px,1.55vw,16px);
  color:#fff;
  letter-spacing:.2em;
  text-transform:uppercase;
  margin-bottom:1.2rem;
  opacity:0;
}
#label-names{
  font-size:clamp(22px,4.5vw,52px);
  font-weight:700;
  color:#fff;
  text-align:center;
  line-height:1.2;
  opacity:0;
}
#label-names span{
  display:block;
  font-size:1em;
  font-weight:700;
  color:#fff;
  margin-top:.1em;
}

/* Titre */
#intro-title{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:flex-start;
  padding-left:6vw;
  z-index:2;pointer-events:none;
  opacity:0;
}
#title-text{
  font-size:clamp(28px,6vw,72px);
  font-weight:900;
  color:#fff;
  line-height:1.0;
  letter-spacing:-.01em;
  text-transform:uppercase;
}

/* Noms compacts haut gauche */
#persistent-names{
  position:fixed;
  top:.9rem;left:1.4rem;
  z-index:10;pointer-events:none;
  opacity:0;
  font-size:12px;font-weight:500;
  color:rgba(255,255,255,0.55);
  line-height:1.5;
  transition:opacity .6s ease;
}

/* Hint tap */
#tap-hint{
  position:fixed;bottom:2rem;left:50%;
  transform:translateX(-50%);
  color:rgba(255,255,255,0.35);
  font-size:11px;letter-spacing:.15em;text-transform:uppercase;
  pointer-events:none;opacity:0;
  transition:opacity .5s ease;z-index:3;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="intro-names">
  <div id="label-by">Présenté par</div>
  <div id="label-names">
    Mathis PLASSART GINNAIN
    <span>et Maximilien FAVRE</span>
  </div>
</div>

<div id="intro-title">
  <div id="title-text">LA TERRE<br>N'EST PAS<br>RONDE</div>
</div>

<div id="persistent-names">
  Mathis PLASSART GINNAIN<br>et Maximilien FAVRE
</div>

<div id="tap-hint"></div>

<script>
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');

const elNames    = document.getElementById('intro-names');
const elBy       = document.getElementById('label-by');
const elNamesLbl = document.getElementById('label-names');
const elTitle    = document.getElementById('intro-title');
const elPersist  = document.getElementById('persistent-names');
const elHint     = document.getElementById('tap-hint');

function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resize();
window.addEventListener('resize', resize);

/* ── Étoiles ── */
const N = 300;
const stars = Array.from({length:N}, () => ({
  x: (Math.random()-.5)*2,
  y: (Math.random()-.5)*2,
  z: Math.random(),
  r: Math.random()*1.3+0.2,
  tw: Math.random()*Math.PI*2,
  sp: Math.random()*.015+.004,
}));

/* ── Timings (ms depuis le démarrage) ── */
// Phase 1 : étoiles fusent + noms : 0 → 4000ms
// Phase 2 : ralentissement + noms fade-out : 4000 → 5200ms
// Phase 3 : titre apparaît : 5000 → 6200ms
// Phase 4 : idle
const T_WARP_END    = 20000; // étoiles fusent 20s ou jusqu au tap
const T_SLOW_DUR    = 3500; // ralentissement plus doux
const T_BY_IN       = 600;   // durée fade-in "présenté par"
const T_BY_START    = 300;
const T_NAMES_IN    = 800;
const T_NAMES_START = 800;
const T_NAMES_OUT   = 6000;  // début fade-out noms
const T_NAMES_OUT_DUR = 600;
const T_TITLE_IN    = 7000;  // début apparition titre
const T_TITLE_DUR   = 3000;
const T_HINT        = 20500; // afficher hint

let startTs    = null;
let isExiting  = false;
let exitStart  = null;
let _onComplete = null;
let phase4Done = false;

function ease(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2 }
function cl(t){ return Math.max(0,Math.min(1,t)) }
function sub(e,s,d){ return ease(cl((e-s)/d)) }

function warpSpeed(elapsed){
  if(elapsed <= T_WARP_END){
    // Accélération progressive pendant 4s
    return ease(cl(elapsed / T_WARP_END));
  } else {
    // Décélération sur T_SLOW_DUR
    return 1 - ease(cl((elapsed - T_WARP_END) / T_SLOW_DUR));
  }
}

function drawStars(elapsed, ga){
  const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2;
  ctx.clearRect(0,0,W,H);

  const spd = warpSpeed(elapsed);

  if(spd > 0.001){
    stars.forEach(s => {
      s.z += spd * 0.020;
      if(s.z > 1) s.z -= 1;
    });
  }

  stars.forEach(s => {
    const p  = 1/(1.2 - s.z*.8);
    const sx = cx + s.x*W*.6*p;
    const sy = cy + s.y*H*.6*p;
    const sr = s.r*p*.8;

    // Traînée quand rapide
    if(spd > 0.08){
      const trailLen = spd * 22 * p;
      const pPrev = 1/(1.2-(s.z-.02)*.8);
      const px = cx + s.x*W*.6*pPrev;
      const py = cy + s.y*H*.6*pPrev;
      const dx = sx-px, dy = sy-py;
      const len = Math.sqrt(dx*dx+dy*dy)||1;
      const g = ctx.createLinearGradient(sx-dx/len*trailLen,sy-dy/len*trailLen,sx,sy);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(1,`rgba(255,255,255,${Math.min(.7,spd*ga)})`);
      ctx.strokeStyle=g; ctx.lineWidth=sr*1.2;
      ctx.beginPath();
      ctx.moveTo(sx-dx/len*trailLen,sy-dy/len*trailLen);
      ctx.lineTo(sx,sy); ctx.stroke();
    }

    const twinkle = spd>.1?1:.7+.3*Math.sin(s.tw+elapsed*s.sp*.001);
    ctx.beginPath();
    ctx.arc(sx,sy,Math.max(.3,sr),0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${Math.min(1,twinkle*ga*(.4+s.z*.6))})`;
    ctx.fill();
  });
}

let _lastIdleDraw = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!startTs) startTs = ts;
  const elapsed = ts - startTs;

  let ga = 1;
  if(isExiting){
    if(!exitStart) exitStart = ts;
    ga = 1 - ease(cl((ts-exitStart)/800));
    canvas.style.opacity = ga;
    if(ga <= 0) return;
  }

  if(phase4Done && !isExiting){
    if(ts - _lastIdleDraw < 66) return;
    _lastIdleDraw = ts;
  }

  drawStars(elapsed, ga);

  /* Noms — apparition */
  elNames.style.opacity   = sub(elapsed, T_BY_START-100, 300);
  elBy.style.opacity      = sub(elapsed, T_BY_START, T_BY_IN);
  elNamesLbl.style.opacity = sub(elapsed, T_NAMES_START, T_NAMES_IN);

  /* Noms — disparition à partir de T_NAMES_OUT */
  if(elapsed > T_NAMES_OUT){
    const outT = sub(elapsed, T_NAMES_OUT, T_NAMES_OUT_DUR);
    elNames.style.opacity = (1 - outT) * parseFloat(elNames.style.opacity||1);
  }

  /* Titre — apparition mot par mot */
  if(elapsed > T_TITLE_IN && !elTitle._split){
    elTitle._split = true;
    const titleEl = elTitle.querySelector('#title-text');
    const lines = ['LA TERRE', "N\'EST PAS", 'RONDE'];
    titleEl.innerHTML = lines.map(line =>
      '<div>' + line.split('').map((ch,i) =>
        ch === ' ' ? ' ' :
        '<span class="tc" style="display:inline-block;opacity:0;transform:translateY(22px);' +
        'transition:opacity 0.35s ease,transform 0.35s ease;">' + ch + '</span>'
      ).join('') + '</div>'
    ).join('');
    const spans = elTitle.querySelectorAll('.tc');
    spans.forEach((sp,i) => {
      setTimeout(() => {
        sp.style.opacity = '1';
        sp.style.transform = 'translateY(0)';
      }, i * 60);
    });
    elTitle.style.opacity = '1';
  }

  /* Hint appuyer */
  if(elapsed > T_HINT && !phase4Done){
    elHint.style.opacity = sub(elapsed, T_HINT, 600);
    /* Noms compacts */
    elPersist.style.opacity = sub(elapsed, T_HINT, 800);
    if(elapsed > T_HINT + 800){
      phase4Done = true;
      if(_onComplete) _onComplete();
      // Signaler au parent que l'animation est terminée
      try { window.parent.postMessage('intro-complete', '*'); } catch(e){}
      // Rendre le hint cliquable pour que le tap remonte bien au parent
      elHint.style.pointerEvents = 'auto';
      elHint.style.cursor = 'pointer';
    }
  }
}

/* Démarrer immédiatement */
requestAnimationFrame(loop);

/* Tap / pointeur : accélère la timeline tant que l’anim n’est pas finie ; ensuite chaque tap envoie "intro-tap" au parent */
let earlyTriggered = false;
function onUserActivation(){
  if(phase4Done){
    try { window.parent.postMessage('intro-tap', '*'); } catch(e){}
    return;
  }
  if(earlyTriggered) return;
  earlyTriggered = true;
  if(startTs !== null){
    const now = performance.now();
    const elapsed = now - startTs;
    if(elapsed < 13000){
      startTs = now - 6000;
    }
  }
  elHint.style.opacity = '0';
}

window.addEventListener('pointerdown', onUserActivation, { passive: true });


/* ── API publique ── */
window.IntroStars = {
  exit(){
    isExiting = true;
    setTimeout(() => {
      document.getElementById('c').style.display      = 'none';
      document.getElementById('intro-names').style.display = 'none';
      document.getElementById('intro-title').style.display = 'none';
      document.getElementById('tap-hint').style.display    = 'none';
    }, 900);
  },
  onComplete(fn){ _onComplete = fn; },
  getSeedPositions(){
    const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2;
    return [{x:cx-W*.15,y:cy},{x:cx,y:cy-H*.1},{x:cx+W*.15,y:cy+H*.08}];
  }
};
</script>
</body>
</html>
