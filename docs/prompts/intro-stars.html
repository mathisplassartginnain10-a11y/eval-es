<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intro — Fond étoilé</title>
<!--
================================================================
GUIDE CURSOR — intro-stars.html
================================================================
Fichier autonome. Fond étoilé animé uniquement (pas de texte ici :
les noms sont affichés une seule fois dans la page parente,
#persistent-names).

SÉQUENCE INTERNE :
  Phase 1 (0-3s)   : étoiles se déplacent vers la caméra (effet warp)
  Phase 2 (3-4.5s) : étoiles ralentissent et s arrêtent
  Puis idle jusqu’au 1er geste (scroll / molette / clic côté parent, ou clic ici en ouverture seule).

AU SCROLL / CLIC — Cursor doit :
  1. Appeler window.IntroStars.start() puis window.IntroStars.exit() → fade-out fond étoilé
  2. Zoomer les 3 iframes Terres depuis scale 0.05 → 1

API window.IntroStars :
  .start()         démarre la boucle d’animation (appelé par la page parente au 1er geste)
  .exit()          fade-out (800ms)
  .onComplete(fn)  callback quand la séquence étoiles a atteint la fin logique (~8,5 s)
  .getStarPositions() retourne [{x,y,r}] pour que Cursor
                    puisse positionner les 3 iframes Terres au moment du zoom
================================================================
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;z-index:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }

/* ── Étoiles ── */
const N = 320;
const stars = Array.from({length:N}, (_, i) => ({
  /* position en coordonnées "espace" centrées sur 0 */
  x: (Math.random() - 0.5) * 2,
  y: (Math.random() - 0.5) * 2,
  z: Math.random(),           /* profondeur 0=loin 1=près */
  r: Math.random() * 1.3 + 0.2,
  twinkle: Math.random() * Math.PI * 2,
  speed:   Math.random() * 0.015 + 0.004,
  /* Marquer 3 étoiles comme "terres" */
  isSeed: i < 3,
}));

/* Positionner les 3 "seeds" à des positions connues */
const SEED_POS = [
  {x:-0.28, y:0.05},
  {x: 0.0,  y:-0.12},
  {x: 0.28, y:0.08},
];
stars.slice(0,3).forEach((s,i)=>{
  s.x = SEED_POS[i].x;
  s.y = SEED_POS[i].y;
  s.z = 0.5;
  s.r = 1.8;
});

/* ── Timings (ms) — fin séquence = même instant qu’ancienne fin « compact » ── */
const T_WARP_DUR    = 3000;
const T_SLOW_DUR    = 1500;
const T_BY_START    = T_WARP_DUR + T_SLOW_DUR + 200;
const T_NAMES_START = T_BY_START + 600;
const T_NAMES_DUR   = 900;
const T_COMPACT     = T_NAMES_START + T_NAMES_DUR + 1200;
const T_COMPACT_DUR = 1100;
const T_INTRO_DONE_MS = T_COMPACT + T_COMPACT_DUR;

let startTs    = null;
let isCompact  = false;
let isExiting  = false;
let exitStart  = null;
let _onComplete = null;

function ease(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2 }
function clamp(t){ return Math.max(0,Math.min(1,t)) }

/* ── Calcul vitesse du warp ── */
function warpSpeed(elapsed){
  if(elapsed < T_WARP_DUR){
    return ease(clamp(elapsed/T_WARP_DUR));
  } else {
    const t = clamp((elapsed - T_WARP_DUR) / T_SLOW_DUR);
    return 1 - ease(t);
  }
}

function drawStars(elapsed, globalAlpha){
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  ctx.clearRect(0,0,W,H);

  const spd = warpSpeed(elapsed);
  if(spd > 0.001){
    stars.forEach(s => {
      s.z += spd * 0.018;
      if(s.z > 1){ s.z -= 1; }
    });
  }

  stars.forEach(s => {
    const perspective = 1 / (1.2 - s.z * 0.8);
    const sx = cx + s.x * W * 0.6 * perspective;
    const sy = cy + s.y * H * 0.6 * perspective;
    const sr = s.r * perspective * 0.8;

    if(spd > 0.05){
      const trailLen = spd * 18 * perspective;
      const dx = s.x * W * 0.6 * perspective - s.x * W * 0.6 * (1/(1.2-(s.z-0.015)*0.8));
      const dy = s.y * H * 0.6 * perspective - s.y * H * 0.6 * (1/(1.2-(s.z-0.015)*0.8));
      const nx = dx===0&&dy===0?0:dx/Math.sqrt(dx*dx+dy*dy);
      const ny = dx===0&&dy===0?-1:dy/Math.sqrt(dx*dx+dy*dy);
      const grad = ctx.createLinearGradient(
        sx - nx*trailLen, sy - ny*trailLen, sx, sy
      );
      grad.addColorStop(0, `rgba(255,255,255,0)`);
      grad.addColorStop(1, `rgba(255,255,255,${Math.min(0.7, spd * globalAlpha)})`);
      ctx.strokeStyle = grad;
      ctx.lineWidth   = sr * 1.2;
      ctx.beginPath();
      ctx.moveTo(sx - nx*trailLen, sy - ny*trailLen);
      ctx.lineTo(sx, sy);
      ctx.stroke();
    }

    const twinkle = spd > 0.1 ? 1 : 0.7 + 0.3*Math.sin(s.twinkle + elapsed*s.speed*0.001);
    ctx.beginPath();
    ctx.arc(sx, sy, Math.max(0.3, sr), 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${Math.min(1, twinkle * globalAlpha * (0.4 + s.z*0.6))})`;
    ctx.fill();
  });
}

let introStarted = false;

function startIntro(){
  if(introStarted) return;
  introStarted = true;
  requestAnimationFrame(loop);
}

function paintStaticStars(){
  drawStars(0, 1);
}

function onResize(){
  resize();
  if(!introStarted) paintStaticStars();
}

function loop(ts){
  requestAnimationFrame(loop);
  if(!startTs) startTs = ts;
  const elapsed = ts - startTs;

  let globalAlpha = 1;
  if(isExiting){
    if(!exitStart) exitStart = ts;
    globalAlpha = 1 - ease(clamp((ts-exitStart)/800));
    canvas.style.opacity = globalAlpha;
    if(globalAlpha <= 0) return;
  }

  drawStars(elapsed, globalAlpha);

  if(elapsed > T_INTRO_DONE_MS && !isCompact && !isExiting){
    isCompact = true;
    if(_onComplete) _onComplete();
  }
}

resize();
window.addEventListener('resize', onResize);
paintStaticStars();
window.addEventListener('click', (e) => {
  if (e.sourceCapabilities?.firesTouchEvents) return
  startIntro()
}, { passive: true });

window.IntroStars = {
  start: startIntro,
  exit(){
    isExiting = true
  },
  onComplete(fn){
    _onComplete = fn;
    if (isCompact && typeof fn === "function") fn();
  },
  getSeedPositions(){
    const W = canvas.width, H = canvas.height;
    const cx = W/2, cy = H/2;
    return stars.slice(0,3).map(s => {
      const p = 1/(1.2-s.z*0.8);
      return {
        x: cx + s.x*W*0.6*p,
        y: cy + s.y*H*0.6*p
      };
    });
  }
};
</script>
</body>
</html>
