<script>
const img   = document.getElementById('puits-img');
const gs    = document.getElementById('gs');
const ga    = document.getElementById('ga');
const gt    = document.getElementById('gt');
const gang  = document.getElementById('gang');
const hint  = document.getElementById('tap-hint');

function ease(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2 }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)) }
function sub(t,s,e){ return ease(clamp((t-s)/(e-s),0,1)) }

function setG(el,alpha,tx,ty){
  el.style.opacity = alpha;
  el.setAttribute('transform',`translate(${tx||0},${ty||0})`);
}

function render(t){
  img.style.opacity        = sub(t, 0,    0.20);
  const sT = sub(t, 0.20, 0.45); setG(gs,   sT,  80*(1-sT), 0);
  const aT = sub(t, 0.40, 0.65); setG(ga,   aT, -80*(1-aT), 0);
  const tT = sub(t, 0.60, 0.80); setG(gt,   tT,  0, -30*(1-tT));
  const gT = sub(t, 0.75, 1.0);  setG(gang, gT,  0,  30*(1-gT));
}

const DURATION = 5000;
let startTs  = null;
let playing  = false;
let rafId    = null;
let started  = false;

function animLoop(ts){
  if(!startTs) startTs = ts;
  const raw = Math.min((ts - startTs) / DURATION, 1);
  render(ease(raw));
  if(raw < 1){
    rafId = requestAnimationFrame(animLoop);
  } else {
    playing = false;
  }
}

/* Démarrage au clic/tap */
function startAnim(){
  if(started) return;
  started = true;
  hint.style.opacity = '0';
  playing  = true;
  startTs  = null;
  rafId    = requestAnimationFrame(animLoop);
}

window.addEventListener('click',      startAnim, { once: true });
window.addEventListener('touchstart', startAnim, { once: true, passive: true });

/* Dessin initial */
render(0);

/* API publique */
window.PuitsAnim = {
  play(){
    startAnim();
  },
  reset(){
    if(rafId) cancelAnimationFrame(rafId);
    playing = false; startTs = null; started = false;
    hint.style.opacity = '1';
    render(0);
  },
  seek(t){
    if(rafId){ cancelAnimationFrame(rafId); playing = false; }
    render(Math.max(0, Math.min(1, t)));
  },
};

/* Conteneur */
const schemaWrap = document.createElement('div');
schemaWrap.id = 'schema-wrap';
document.body.appendChild(schemaWrap);

/* Canvas étoiles fond */
const sCanvas = document.createElement('canvas');
sCanvas.id = 'schema-canvas';
schemaWrap.appendChild(sCanvas);
const sctx = sCanvas.getContext('2d');
function resizeSCanvas(){sCanvas.width=window.innerWidth;sCanvas.height=window.innerHeight;}
resizeSCanvas();
window.addEventListener('resize',resizeSCanvas);

/* Étoiles */
const sStars = Array.from({length:180},()=>({
  x:Math.random()*sCanvas.width,
  y:Math.random()*sCanvas.height,
  r:Math.random()*.8+.2,
  a:Math.random()*.4+.1,
  vx:(Math.random()-.5)*.05,
  vy:(Math.random()-.5)*.05,
  tw:Math.random()*Math.PI*2,
  sp:Math.random()*.005+.002,
}));
let sFr=0, sRaf=null;
function drawSStars(){
  sCanvas.width=window.innerWidth;sCanvas.height=window.innerHeight;
  const W=sCanvas.width,H=sCanvas.height;
  sctx.clearRect(0,0,W,H);
  sFr++;
  sStars.forEach(s=>{
    s.x+=s.vx;s.y+=s.vy;
    if(s.x<0)s.x=W;if(s.x>W)s.x=0;
    if(s.y<0)s.y=H;if(s.y>H)s.y=0;
    const tw=.7+.3*Math.sin(s.tw+sFr*s.sp);
    sctx.beginPath();sctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    sctx.fillStyle='rgba(255,255,255,'+s.a*tw+')';sctx.fill();
  });
  sRaf=requestAnimationFrame(drawSStars);
}

/* Caption */
const schemaCaption = document.createElement('div');
schemaCaption.id = 'schema-caption';
schemaCaption.textContent = 'Syene · 7,2° · 800 km · 500 000 stades';
schemaWrap.appendChild(schemaCaption);

let schemaVisible = false;

function showSchema(){
  if(schemaVisible) return;
  schemaVisible = true;

  /* Lancer étoiles */
  drawSStars();

  /* Fade-in conteneur */
  schemaWrap.style.pointerEvents = 'auto';
  schemaWrap.style.transition = 'opacity .6s ease';
  schemaWrap.style.opacity = '1';

  /* Apparition image + textes avec délai */
  setTimeout(()=>{
    schemaTitle.style.opacity   = '1';
    schemaTitle.style.transform = 'translateY(0)';
  }, 200);
  setTimeout(()=>{
    schemaImgEl.style.opacity   = '1';
    schemaImgEl.style.transform = 'scale(1) translateY(0)';
  }, 400);
  setTimeout(()=>{
    schemaCaption.style.opacity = '1';
  }, 1000);
}

function hideSchema(){
  schemaWrap.style.opacity = '0';
  schemaWrap.style.pointerEvents = 'none';
  schemaVisible = false;
  if(sRaf){ cancelAnimationFrame(sRaf); sRaf=null; }
}

/* 2e clic → schéma */
let schemaShown = false;
let animDone    = false;
setTimeout(() => { animDone = true; }, 5500);
window.addEventListener('click', () => {
  if(animDone && !schemaShown) { schemaShown=true; showSchema(); }
});
window.addEventListener('touchstart', () => {
  if(animDone && !schemaShown) { schemaShown=true; showSchema(); }
}, {passive:true});

/* Reset */
window.addEventListener('message', e => {
  if(e.data === 'reset'){ hideSchema(); schemaShown=false; animDone=false;
    setTimeout(()=>{animDone=true;},5500); }
});
</script>
