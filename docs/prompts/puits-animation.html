<div id="tap-hint">Appuyer pour lancer</div>

<script>
const img   = document.getElementById('puits-img');
const gs    = document.getElementById('gs');
const ga    = document.getElementById('ga');
const gt    = document.getElementById('gt');
const gang  = document.getElementById('gang');
const hint  = document.getElementById('tap-hint');

function ease(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2 }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)) }
function sub(t,s,e){ return ease(clamp((t-s)/(e-s),0,1)) }

function setG(el,alpha,tx,ty){
  el.style.opacity = alpha;
  el.setAttribute('transform',`translate(${tx||0},${ty||0})`);
}

/** Image visible seule : textes / badges hors écran, opacité 0 */
function applyInitialStatic(){
  img.style.opacity = '1';
  setG(gs,   0,  80,  0);
  setG(ga,   0, -80,  0);
  setG(gt,   0,   0, -30);
  setG(gang, 0,   0,  30);
}

function render(t){
  img.style.opacity        = sub(t, 0,    0.20);
  const sT = sub(t, 0.20, 0.45); setG(gs,   sT,  80*(1-sT), 0);
  const aT = sub(t, 0.40, 0.65); setG(ga,   aT, -80*(1-aT), 0);
  const tT = sub(t, 0.60, 0.80); setG(gt,   tT,  0, -30*(1-tT));
  const gT = sub(t, 0.75, 1.0);  setG(gang, gT,  0,  30*(1-gT));
}

const DURATION = 5000;
let startTs  = null;
let playing  = false;
let rafId    = null;
let started  = false;

function animLoop(ts){
  if(!startTs) startTs = ts;
  const raw = Math.min(0.20 + ((ts - startTs) / DURATION) * 0.80, 1);
  render(raw);
  if(raw < 1){
    rafId = requestAnimationFrame(animLoop);
  } else {
    playing = false;
  }
}

/* Démarrage sur message du parent (évite le double déclenchement avec la nav globale) */
function startAnim(){
  if(started) return;
  started = true;
  hint.style.opacity = '0';
  playing  = true;
  startTs  = null;
  rafId    = requestAnimationFrame(animLoop);
}

/* État initial : image seule */
applyInitialStatic();

/* API publique */
window.PuitsAnim = {
  play(){
    startAnim();
  },
  reset(){
    if(rafId) cancelAnimationFrame(rafId);
    playing = false; startTs = null; started = false;
    hint.style.opacity = '0';
    applyInitialStatic();
  },
  seek(t){
    if(rafId){ cancelAnimationFrame(rafId); playing = false; }
    render(Math.max(0, Math.min(1, t)));
  },
};

window.addEventListener('message', (e) => {
  if (e.data === 'play') startAnim();
  if (e.data === 'reset') window.PuitsAnim?.reset?.();
});
</script>
