<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Les trois Terres — scène unique</title>
<!--
  Une scène WebGL + intro séquencée (sprites → zoom caméra → révélation des globes).
  Layout : sphère bas-gauche, aplatie haut-droite, triangle bas-droite — globes ×1,5 et positions fortement écartées.
  GLB droite : groupe `*-orient-lock` (rotation fixe une fois au load) ; seuls les pivots tournent en tick.
  API : window.ThreeGlobes.setSpeed / pause / resume ; à la fin de l’intro (~5,5 s),
  window.parent.postMessage("intro-complete", "*") pour synchroniser la nav parente.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    margin: 0;
    padding: 0;
    border: none;
    outline: none;
    vertical-align: top;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "gsap": "https://esm.sh/gsap@3.12.5"
  }
}
</script>
<script type="module">
import * as THREE from "three"
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"
import gsap from "gsap"

const isIpad =
  /iPad/i.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)

const canvas = document.getElementById("c")
const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: false,
  powerPreference: "low-power",
  alpha: false,
})
// [FIX] Taille physique correcte + pas de cadre autour du canvas
const _dpr = Math.min(window.devicePixelRatio || 1, 2)
renderer.setPixelRatio(_dpr)
renderer.setSize(window.innerWidth, window.innerHeight, false)
renderer.setClearColor(0x000000, 1)
canvas.style.margin = "0"
canvas.style.padding = "0"
canvas.style.display = "block"
canvas.style.border = "none"
canvas.style.outline = "none"
canvas.style.width = "100%"
canvas.style.height = "100%"
renderer.outputColorSpace = THREE.SRGBColorSpace

const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(
  50,
  window.innerWidth / Math.max(1, window.innerHeight),
  0.1,
  200
)

scene.add(new THREE.AmbientLight(0xffffff, isIpad ? 0.42 : 0.48))
const sun = new THREE.DirectionalLight(0xffffff, isIpad ? 1.05 : 1.2)
sun.position.set(6, 3, 5)
scene.add(sun)

/** Cap doux du dt pour éviter les sauts au retour de visibilité ou onglet en arrière-plan. */
const MAX_DT = 1 / 20
/** Vitesse cible normalisée (rad/s) — calibrée comme si l'on tournait à 30 fps avant. */
const REF_FPS = 30
let lastFrame = 0
let orbitAngle = 0
let paused = false
let speed = 1
/** @type {number | null} */
let rafId = null
/** @type {ReturnType<typeof setTimeout> | null} */
let resizeTimer = null

/** Vitesse orbite caméra (rad / seconde) — valeur de base × facteur pour page 1 plus dynamique. */
const ORBIT_STEP_PER_SEC = ((2 * Math.PI) / (12 * 60)) * 12 * REF_FPS
/** Rotation propre des globes (rad / seconde) — alignée sur le facteur d'accélération. */
const SPIN_BASE_PER_SEC = 0.0048 * 12 * REF_FPS
/** Rotation lente du starfield (rad / seconde). */
const STARS_SPIN_PER_SEC = 0.00105 * REF_FPS

const sphereSeg = isIpad ? 24 : 32

/** @type {THREE.Group | null} */
let earthPivot = null
/** @type {THREE.Group | null} */
let aplatiePivot = null
/** @type {THREE.Group | null} */
let conePivot = null

/** Fond étoilé */
let starsPoints = null

/** Sprites « graines » (alignés sur les 3 Terres) */
/** @type {THREE.Sprite[]} */
const seedSprites = []

/** Début intro (ms) */
const startTime = Date.now()
let glbLoaded = 0
let earthAssetReady = false
let revealScheduled = false
/** Après 5,5 s : rotation continue + caméra en orbite */
let animating = false

/** @type {THREE.Object3D | null} Groupe `aplatie-orient-lock` (rotation fixe ; debug clavier) */
let aplatie = null
/** @type {THREE.Object3D | null} Groupe `cone-orient-lock` */
let cone = null

let meshyRotKeyDebugInstalled = false

function getLayoutSnapshot() {
  const aspect = window.innerWidth / Math.max(1, window.innerHeight)
  const narrow = aspect < 1.3
  if (narrow) {
    return {
      sphere: new THREE.Vector3(-2.115, -0.482, 0),
      aplatie: new THREE.Vector3(1.626, 1.883, 0),
      cone: new THREE.Vector3(1.97, -1.6, 0),
      cam: new THREE.Vector3(0.22, 0.05, 16.2),
      look: new THREE.Vector3(0.52, 0.06, 0),
    }
  }
  return {
    sphere: new THREE.Vector3(-3.353, -0.792, 0),
    aplatie: new THREE.Vector3(2.407, 2.616, 0),
    cone: new THREE.Vector3(2.887, -2.184, 0),
    cam: new THREE.Vector3(0.52, 0.05, 18.2),
    look: new THREE.Vector3(0.62, -0.06, 0),
  }
}

function updateLayout() {
  const L = getLayoutSnapshot()

  camera.fov = 50
  camera.aspect = window.innerWidth / Math.max(1, window.innerHeight)
  camera.updateProjectionMatrix()
  camera.position.copy(L.cam)
  camera.lookAt(L.look)

  if (earthPivot) earthPivot.position.copy(L.sphere)
  if (aplatiePivot) aplatiePivot.position.copy(L.aplatie)
  if (conePivot) conePivot.position.copy(L.cone)

  layoutSeedSprites()
}

function layoutSeedSprites() {
  const L = getLayoutSnapshot()
  const pts = [L.sphere, L.aplatie, L.cone]
  seedSprites.forEach((spr, i) => {
    if (pts[i]) spr.position.copy(pts[i])
  })
}

function createSeedSprites() {
  const gold = new THREE.Color(0xffd27a)
  for (let i = 0; i < 3; i++) {
    const mat = new THREE.SpriteMaterial({
      color: gold,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    })
    const sprite = new THREE.Sprite(mat)
    sprite.scale.set(0.15, 0.15, 1)
    sprite.userData.baseScale = 0.22
    scene.add(sprite)
    seedSprites.push(sprite)
  }
  layoutSeedSprites()
}

function runIntroSpritePhase() {
  seedSprites.forEach((sprite, i) => {
    gsap.to(sprite.material, {
      opacity: 0.92,
      duration: 0.6,
      delay: 0.5 + i * 0.3,
      ease: "power2.out",
    })
    gsap.to(sprite.scale, {
      x: 0.25,
      y: 0.25,
      z: 1,
      duration: 0.8,
      delay: 0.5 + i * 0.3,
      ease: "elastic.out(1, 0.5)",
    })
  })
}

function runIntroCameraZoom() {
  const L = getLayoutSnapshot()
  const zEnd = L.cam.z
  gsap.fromTo(
    camera.position,
    { x: L.cam.x, y: L.cam.y, z: Math.max(zEnd + 6, 16) },
    {
      x: L.cam.x,
      y: L.cam.y,
      z: zEnd,
      duration: 1.5,
      delay: 2.0,
      ease: "power3.inOut",
      onUpdate: () => {
        camera.lookAt(L.look)
      },
    }
  )
}

/**
 * Centre le modèle à l’origine et applique un scale uniforme (sans rotation).
 */
function fitModelInBox(model, targetMax) {
  const box = new THREE.Box3().setFromObject(model)
  const size = box.getSize(new THREE.Vector3())
  const ctr = box.getCenter(new THREE.Vector3())
  const sc = targetMax / Math.max(size.x, size.y, size.z, 1e-6)
  model.scale.setScalar(sc)
  model.position.copy(ctr.clone().multiplyScalar(-sc))
}

function applyPivotRenderOrders() {
  const pairs = [
    [aplatiePivot, 2],
    [conePivot, 1],
    [earthPivot, 3],
  ]
  pairs.forEach(([pivot, order]) => {
    if (!pivot) return
    pivot.traverse((o) => {
      if (o.isMesh) o.renderOrder = order
    })
  })
}

/**
 * DEBUG Meshy — activer avec **?meshyRotDebug=1** sur l’URL de cette page.
 * 1/2 = ±X, 3/4 = ±Y, 5/6 = ±Z (pas 15°), T = bascule aplatie/cône, R = reset rotation courante.
 * Noter les angles dans la console puis coder en dur et supprimer ce bloc.
 */
function tryInstallMeshyRotKeyboardDebug() {
  if (!new URLSearchParams(window.location.search).has("meshyRotDebug")) return
  if (!aplatie || !cone || meshyRotKeyDebugInstalled) return
  meshyRotKeyDebugInstalled = true

  let target = "aplatie"
  const ROT_STEP = Math.PI / 12

  window.__threeGlobesScene = scene

  function onMeshyRotDebugKey(e) {
    const obj = target === "aplatie" ? aplatie : cone
    if (!obj) return

    const k = e.key
    if (k === "1") {
      obj.rotation.x += ROT_STEP
      e.preventDefault()
    } else if (k === "2") {
      obj.rotation.x -= ROT_STEP
      e.preventDefault()
    } else if (k === "3") {
      obj.rotation.y += ROT_STEP
      e.preventDefault()
    } else if (k === "4") {
      obj.rotation.y -= ROT_STEP
      e.preventDefault()
    } else if (k === "5") {
      obj.rotation.z += ROT_STEP
      e.preventDefault()
    } else if (k === "6") {
      obj.rotation.z -= ROT_STEP
      e.preventDefault()
    } else if (k === "t" || k === "T") {
      target = target === "aplatie" ? "cone" : "aplatie"
      console.log("Target:", target)
      e.preventDefault()
    } else if (k === "r" || k === "R") {
      obj.rotation.set(0, 0, 0)
      e.preventDefault()
    } else {
      return
    }

    console.log(
      target,
      "rotation:",
      obj.rotation.x.toFixed(3),
      obj.rotation.y.toFixed(3),
      obj.rotation.z.toFixed(3)
    )
  }

  window.addEventListener("keydown", onMeshyRotDebugKey)
}

function attachGlobesOrdered() {
  if (!earthPivot || !aplatiePivot || !conePivot) return
  ;[earthPivot, aplatiePivot, conePivot].forEach((p) => {
    if (p?.parent) scene.remove(p)
  })
  scene.add(aplatiePivot)
  scene.add(conePivot)
  scene.add(earthPivot)
  applyPivotRenderOrders()
  updateLayout()
  tryInstallMeshyRotKeyboardDebug()
}

function layoutGlobes() {
  updateLayout()
}

function scheduleRevealIfReady() {
  if (!earthAssetReady || glbLoaded < 2 || revealScheduled) return
  revealScheduled = true
  const elapsed = Date.now() - startTime
  const remaining = Math.max(0, 3500 - elapsed)
  window.setTimeout(() => revealGlobes(), remaining)
}

function revealGlobes() {
  const pivots = [earthPivot, aplatiePivot, conePivot]
  pivots.forEach((pivot, i) => {
    const spr = seedSprites[i]
    if (!pivot || !spr) return

    pivot.visible = true
    const target = pivot.userData.targetScale ?? 1
    pivot.scale.setScalar(0.001)

    gsap.to(spr.material, {
      opacity: 0,
      duration: 0.4,
      delay: i * 0.25,
    })

    gsap.to(pivot.scale, {
      x: target,
      y: target,
      z: target,
      duration: 1.0,
      delay: i * 0.25,
      ease: "back.out(1.4)",
      onComplete: () => {
        if (spr.parent) scene.remove(spr)
      },
    })
  })
}

/** Lance la rotation « infinie » et l’orbite caméra après la séquence intro */
function schedulePostIntro() {
  window.setTimeout(() => {
    animating = true
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage("intro-complete", "*")
      }
    } catch (_) {
      /* ignore */
    }
  }, 5500)
}

const loader = new GLTFLoader()

/** @type {unknown} */
let threeGlobesDebugGui = null

/** `?globesDebug=1` — lil-gui pour régler les rotations GLB ; retirer l’URL en prod. */
function maybeAttachGlobeRotationDebug(label, model) {
  if (!new URLSearchParams(window.location.search).has("globesDebug")) return
  void import("https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm").then(({ GUI }) => {
    if (!model?.rotation) return
    threeGlobesDebugGui = threeGlobesDebugGui ?? new GUI({ title: "Globes GLB" })
    const f = threeGlobesDebugGui.addFolder(label)
    f.add(model.rotation, "x", -Math.PI, Math.PI, 0.01).name("x")
    f.add(model.rotation, "y", -Math.PI, Math.PI, 0.01).name("y")
    f.add(model.rotation, "z", -Math.PI, Math.PI, 0.01).name("z")
    f.open()
  })
}

/* ——— Setup intro immédiat ——— */
addStarfield()
createSeedSprites()
updateLayout()
runIntroSpritePhase()
runIntroCameraZoom()
schedulePostIntro()

function tick(ts) {
  rafId = requestAnimationFrame(tick)
  if (paused || document.hidden) {
    lastFrame = ts
    return
  }
  if (lastFrame === 0) lastFrame = ts
  const dt = Math.min(MAX_DT, Math.max(0, (ts - lastFrame) / 1000))
  lastFrame = ts

  if (starsPoints) {
    starsPoints.rotation.y += STARS_SPIN_PER_SEC * speed * dt
  }

  const pulseT = Date.now() * 0.003
  seedSprites.forEach((spr, i) => {
    if (!spr.parent) return
    const m = spr.material
    const elapsed = Date.now() - startTime
    if (m.opacity > 0.08 && elapsed > 2200) {
      const base = spr.userData.baseScale ?? 0.22
      const pulse = 0.8 + 0.2 * Math.sin(pulseT + i * 1.2)
      spr.scale.set(base * pulse, base * pulse, 1)
    }
  })

  const L = getLayoutSnapshot()
  if (animating) {
    orbitAngle += ORBIT_STEP_PER_SEC * speed * dt
    const dist = L.cam.z
    const wobble = Math.sin(orbitAngle * 0.12) * 0.35
    camera.position.set(L.cam.x + wobble, L.cam.y + Math.sin(orbitAngle * 0.08) * 0.06, dist)
    camera.lookAt(L.look)

    const sp = SPIN_BASE_PER_SEC * speed * dt
    if (earthPivot?.visible) earthPivot.rotation.y += sp
    /* Orientation Meshy : uniquement sur les pivots — jamais sur modelAplatie / modelRocher ni *-orient-lock */
    if (aplatiePivot?.visible) aplatiePivot.rotation.y += sp
    if (conePivot?.visible) conePivot.rotation.y += sp
  } else {
    camera.lookAt(L.look)
  }

  renderer.render(scene, camera)
}

function startLoop() {
  if (rafId != null) cancelAnimationFrame(rafId)
  lastFrame = 0
  rafId = requestAnimationFrame(tick)
}

startLoop()

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    paused = true
    if (rafId != null) {
      cancelAnimationFrame(rafId)
      rafId = null
    }
  } else {
    paused = false
    startLoop()
  }
})

window.addEventListener("message", (e) => {
  if (e.data === "pause") paused = true
  if (e.data === "resume") {
    paused = false
    if (rafId == null) startLoop()
  }
})

window.addEventListener(
  "resize",
  () => {
    if (resizeTimer) clearTimeout(resizeTimer)
    resizeTimer = window.setTimeout(() => {
      resizeTimer = null
      const w = window.innerWidth
      const h = window.innerHeight
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2))
      renderer.setSize(w, h, false)
      updateLayout()
      if (animating) {
        const L = getLayoutSnapshot()
        camera.position.z = L.cam.z
      }
    }, 200)
  },
  { passive: true }
)

queueMicrotask(() => {
  window.dispatchEvent(new Event("resize"))
})

function addStarfield() {
  const n = isIpad ? 1200 : 2200
  const pos = new Float32Array(n * 3)
  for (let i = 0; i < n * 3; i += 3) {
    const r = 40 + Math.random() * 55
    const th = Math.random() * Math.PI * 2
    const ph = Math.acos(2 * Math.random() - 1)
    pos[i] = r * Math.sin(ph) * Math.cos(th)
    pos[i + 1] = r * Math.sin(ph) * Math.sin(th)
    pos[i + 2] = r * Math.cos(ph)
  }
  const geo = new THREE.BufferGeometry()
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3))
  const mat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: isIpad ? 0.036 : 0.04,
    transparent: true,
    opacity: 0.38,
    depthWrite: false,
  })
  starsPoints = new THREE.Points(geo, mat)
  scene.add(starsPoints)
}

/* ——— Terre sphère (grande, bas-gauche) ——— */
new THREE.TextureLoader().load(
  "./textures/earth-texture.jpg",
  (earthTex) => {
    earthTex.colorSpace = THREE.SRGBColorSpace
    const earthR = 1.62
    const globe = new THREE.Mesh(
      new THREE.SphereGeometry(earthR, sphereSeg, sphereSeg),
      new THREE.MeshPhongMaterial({
        map: earthTex,
        specular: new THREE.Color(0x1a3355),
        shininess: 18,
      })
    )
    earthPivot = new THREE.Group()
    earthPivot.userData.targetScale = 1
    earthPivot.add(globe)
    const halo = new THREE.Mesh(
      new THREE.SphereGeometry(earthR * 1.05, Math.min(sphereSeg, 28), Math.min(sphereSeg, 28)),
      new THREE.MeshPhongMaterial({
        color: 0x4499ff,
        transparent: true,
        opacity: 0.07,
        side: THREE.BackSide,
      })
    )
    earthPivot.add(halo)
    earthPivot.visible = false
    attachGlobesOrdered()
    earthAssetReady = true
    scheduleRevealIfReady()
  },
  undefined,
  () => {
    earthAssetReady = true
    scheduleRevealIfReady()
  }
)

/* ——— Terre aplatie (haut-droite) ——— */
new THREE.TextureLoader().load(
  "./textures/aplatie-texture.png",
  (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace
    loader.load(
      "./models/terre-aplatie.glb",
      (gltf) => {
        const modelAplatie = gltf.scene
        applyPhongTextured(modelAplatie, tex)
        fitModelInBox(modelAplatie, 2.34)
        const aplatieOrientLock = new THREE.Group()
        aplatieOrientLock.name = "aplatie-orient-lock"
        aplatieOrientLock.add(modelAplatie)
        /* Fix axe « up » export : une seule fois sur ce groupe — animate() ne touche qu’à aplatiePivot */
        aplatieOrientLock.rotation.set(Math.PI, 0, 0)
        maybeAttachGlobeRotationDebug("Aplatie rotation", aplatieOrientLock)
        aplatie = aplatieOrientLock
        aplatiePivot = new THREE.Group()
        aplatiePivot.userData.targetScale = 1
        aplatiePivot.add(aplatieOrientLock)
        aplatiePivot.visible = false
        attachGlobesOrdered()
        glbLoaded += 1
        scheduleRevealIfReady()
      },
      undefined,
      () => {
        glbLoaded += 1
        scheduleRevealIfReady()
      }
    )
  },
  undefined,
  () => {}
)

/* ——— Terre triangle / cône (bas-droite) ——— */
new THREE.TextureLoader().load(
  "./textures/cone-texture.png",
  (tex) => {
    tex.colorSpace = THREE.SRGBColorSpace
    loader.load(
      "./models/terre-cone.glb",
      (gltf) => {
        const modelRocher = gltf.scene
        applyPhongTextured(modelRocher, tex)
        fitModelInBox(modelRocher, 2.34)
        const coneOrientLock = new THREE.Group()
        coneOrientLock.name = "cone-orient-lock"
        coneOrientLock.add(modelRocher)
        coneOrientLock.rotation.set(Math.PI, 0, 0)
        maybeAttachGlobeRotationDebug("Cone rotation", coneOrientLock)
        cone = coneOrientLock
        conePivot = new THREE.Group()
        conePivot.userData.targetScale = 1
        conePivot.add(coneOrientLock)
        conePivot.visible = false
        attachGlobesOrdered()
        glbLoaded += 1
        scheduleRevealIfReady()
      },
      undefined,
      () => {
        glbLoaded += 1
        scheduleRevealIfReady()
      }
    )
  },
  undefined,
  () => {}
)

function applyPhongTextured(root, tex) {
  root.traverse((c) => {
    if (c.isMesh) {
      c.material = new THREE.MeshPhongMaterial({
        map: tex,
        specular: new THREE.Color(0x111122),
        shininess: 10,
      })
    }
  })
}

window.ThreeGlobes = {
  setSpeed(v) {
    speed = typeof v === "number" && v > 0 ? v : 1
  },
  pause() {
    paused = true
  },
  resume() {
    paused = false
    if (rafId == null) startLoop()
  },
}
</script>
</body>
</html>
