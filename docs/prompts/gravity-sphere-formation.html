<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity — Sphère parfaite</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui,sans-serif}
canvas{display:block}
#overlay{position:fixed;inset:0;pointer-events:none;z-index:10}
/* Textes bas */
#msg{
  position:fixed;bottom:7vh;left:50%;transform:translateX(-50%);
  text-align:center;width:90%;max-width:680px;
}
.line{
  color:#fff;font-size:clamp(11px,1.45vw,14px);
  letter-spacing:.05em;line-height:1.65;
  opacity:0;transform:translateY(10px);
  transition:opacity .8s ease,transform .8s ease;
}
.line.vis{opacity:1;transform:translateY(0)}
/* Formule */
#formula{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-58%);
  font-size:clamp(14px,2.2vw,22px);
  color:#fff;font-style:italic;
  opacity:0;transition:opacity 1.4s ease;
  text-shadow:0 0 28px rgba(74,158,255,.7),0 0 70px rgba(74,158,255,.3);
  pointer-events:none;letter-spacing:.06em;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div id="formula">U(r) = −G · Mm / r</div>
  <div id="msg">
    <div class="line" id="l1">Au départ, la matière est dispersée dans l'espace.</div>
    <div class="line" id="l2">La gravité attire chaque fragment vers un centre commun.</div>
    <div class="line" id="l3">Les reliefs s'effondrent — la sphère devient la seule forme stable.</div>
    <div class="line" id="l4">Ce phénomène est l'équilibre hydrostatique.</div>
    <div class="line" id="l5">Aucune autre forme n'est possible.</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

/* ════════════════════════════════════════════════
   RENDERER
════════════════════════════════════════════════ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'low-power' });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);
renderer.shadowMap.enabled = false;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 1.5, 8.5);
camera.lookAt(0, 0, 0);

/* ════════════════════════════════════════════════
   LUMIÈRES
════════════════════════════════════════════════ */
const ambLight = new THREE.AmbientLight(0xffffff, 0.18);
scene.add(ambLight);
const sun = new THREE.DirectionalLight(0x6ab8ff, 1.4);
sun.position.set(4, 5, 6);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x4ECDC4, 0.35);
rim.position.set(-5, -3, -4);
scene.add(rim);

/* ════════════════════════════════════════════════
   ÉTOILES
════════════════════════════════════════════════ */
const starPts = new Float32Array(2400 * 3);
for(let i = 0; i < starPts.length; i++) starPts[i] = (Math.random() - .5) * 160;
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPts, 3));
const starField = new THREE.Points(starGeo,
  new THREE.PointsMaterial({ color: 0xffffff, size: .055, transparent: true, opacity: .5 }));
scene.add(starField);

/* ════════════════════════════════════════════════
   LIGNES GRAVITATIONNELLES
════════════════════════════════════════════════ */
const gravLines = [];
const N_LINES = 40;
for(let i = 0; i < N_LINES; i++){
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  const d     = 2.8 + Math.random() * 2.5;
  const start = new THREE.Vector3(
    d * Math.sin(phi) * Math.cos(theta),
    d * Math.sin(phi) * Math.sin(theta),
    d * Math.cos(phi)
  );
  const geo = new THREE.BufferGeometry().setFromPoints([start, new THREE.Vector3(0,0,0)]);
  const mat = new THREE.LineBasicMaterial({ color: 0x4A9EFF, transparent: true, opacity: 0 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  gravLines.push({ line, mat, start });
}

/* ════════════════════════════════════════════════
   FRAGMENTS
════════════════════════════════════════════════ */
const N_FRAGS = 200;
const fragments = [];
const fragGroup = new THREE.Group();
scene.add(fragGroup);

function randVec3OnSphere(r){ 
  const theta = Math.random() * Math.PI * 2;
  const phi   = Math.acos(2 * Math.random() - 1);
  return new THREE.Vector3(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
}

for(let i = 0; i < N_FRAGS; i++){
  const r   = .04 + Math.random() * .18;
  const geo = new THREE.IcosahedronGeometry(r, 0);
  // Déformation rocheuse
  const pos = geo.attributes.position;
  for(let v = 0; v < pos.count; v++){
    pos.setXYZ(v, pos.getX(v)*(.6+Math.random()*.8), pos.getY(v)*(.6+Math.random()*.8), pos.getZ(v)*(.6+Math.random()*.8));
  }
  geo.computeVertexNormals();
  const col = new THREE.Color().setHSL(.6 + Math.random()*.05, .1 + Math.random()*.1, .3 + Math.random()*.3);
  const mat = new THREE.MeshPhongMaterial({ color: col, specular: 0x111111, shininess: 5, transparent: true, opacity: 1 });
  const mesh = new THREE.Mesh(geo, mat);

  const d    = .7 + Math.random() * 2.6;
  mesh.position.copy(randVec3OnSphere(d));

  /* Vitesse orbitale initiale tangentielle — donne l'aspect orbital */
  const up = new THREE.Vector3(0, 1, 0);
  const tangent = new THREE.Vector3().crossVectors(mesh.position.clone().normalize(), up).normalize();
  const orbitalSpeed = (.012 + Math.random() * .018) * (Math.random() > .5 ? 1 : -1);
  mesh._vel = tangent.multiplyScalar(orbitalSpeed);
  mesh._rotSpd = new THREE.Vector3((Math.random()-.5)*.04,(Math.random()-.5)*.04,(Math.random()-.5)*.04);
  mesh._origPos = mesh.position.clone();
  mesh._mass    = r * r;
  fragGroup.add(mesh);
  fragments.push(mesh);
}

/* ════════════════════════════════════════════════
   MASSE CENTRALE — évolue de bosselée → sphère
════════════════════════════════════════════════ */
let bumpAmount  = 1.0; // 1=très bosselé, 0=sphère parfaite
let sphereSize  = 0.0;
const SPHERE_SEGS = 48;

// Géométrie sphère avec déformation "bosses"
function buildCentralSphere(bumpAmt, radius){
  const geo  = new THREE.SphereGeometry(radius, SPHERE_SEGS, SPHERE_SEGS);
  const pos  = geo.attributes.position;
  const nrm  = geo.attributes.normal;
  for(let i = 0; i < pos.count; i++){
    const nx = nrm.getX(i), ny = nrm.getY(i), nz = nrm.getZ(i);
    // Plusieurs octaves de bruit pour les bosses
    const noise = 
      Math.sin(nx*8.3 + ny*5.1) * .14 +
      Math.sin(ny*9.7 + nz*4.8) * .09 +
      Math.sin(nz*7.2 + nx*11.4) * .06 +
      Math.sin(nx*15 + nz*6)    * .04;
    const disp = noise * bumpAmt;
    pos.setXYZ(i, pos.getX(i)*(1+disp), pos.getY(i)*(1+disp), pos.getZ(i)*(1+disp));
  }
  geo.computeVertexNormals();
  return geo;
}

const centralMat = new THREE.MeshPhongMaterial({
  color: 0x1a3355, specular: 0x4A9EFF, shininess: 40,
  transparent: true, opacity: 0,
  emissive: 0x0a1525, emissiveIntensity: .4
});
let centralMesh = new THREE.Mesh(buildCentralSphere(1.0, .001), centralMat);
scene.add(centralMesh);

/* Halo */
const haloMat = new THREE.MeshPhongMaterial({ color: 0x4A9EFF, transparent: true, opacity: 0, side: THREE.BackSide });
const haloMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), haloMat);
scene.add(haloMesh);

/* Glow point au centre */
const glowGeo = new THREE.SphereGeometry(.05, 12, 12);
const glowMat = new THREE.MeshBasicMaterial({ color: 0x4A9EFF, transparent: true, opacity: 0 });
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
scene.add(glowMesh);

/* ════════════════════════════════════════════════
   TIMING
════════════════════════════════════════════════ */
const T = {
  TEXT1_IN     : 1200,
  FORMULA_IN   : 4500,
  GRAV_LINES_IN: 4800,
  GRAVITY_START: 5200,
  CORE_APPEARS : 8500,
  TEXT2_IN     : 9000,
  SMOOTHING_START: 13000,
  TEXT3_IN     : 14000,
  TEXT4_IN     : 17500,
  TEXT5_IN     : 21000,
  GLOW_PEAK    : 18000,
  TOTAL        : 25000
};

/** Mouvements calibrés sur T.TOTAL (25 s) */
const MOTION = {
  CAM_BOB_CYCLES: 1.0,
  CAM_BOB_AMP   : 0.6,
  SPHERE_SPIN   : Math.PI * 0.55,
  /** Défilement étoiles gauche → droite sur toute l’animation */
  STAR_TURNS    : 0.22,
};

/* ════════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════════ */
function ease(t){ return t < .5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function cl(v,a,b){ return Math.max(a,Math.min(b,v)); }
function sub(t,s,e){ return ease(cl((t-s)/(e-s),0,1)); }
function show(id){ document.getElementById(id).classList.add('vis'); }
function hide(id){ document.getElementById(id).classList.remove('vis'); }
function setF(id,v){ document.getElementById(id).style.opacity = v; }

let prevBump  = -1;
let prevSzKey = -1;

function updateCentralSphere(bmp, sz){
  // Reconstruire seulement si changement significatif
  const bKey = Math.round(bmp * 20);
  const sKey = Math.round(sz * 40);
  if(bKey === prevBump && sKey === prevSzKey) return;
  prevBump = bKey; prevSzKey = sKey;
  centralMesh.geometry.dispose();
  centralMesh.geometry = buildCentralSphere(bmp, Math.max(.001, sz));
  haloMesh.scale.setScalar(sz * 1.08);
}

/* ════════════════════════════════════════════════
   ANIMATION
════════════════════════════════════════════════ */
let startTime  = null;
let paused     = false;
let playing    = false;
let rafId      = null;
const FRAME_MS = 1000 / 30;
let lastFrame  = 0;
let cameraAngle = 0;

function tick(ts){
  rafId = requestAnimationFrame(tick);
  if(paused || !playing) return;
  if(ts - lastFrame < FRAME_MS) return;
  const dt = Math.min(ts - lastFrame, 50);
  lastFrame = ts;

  if(!startTime) startTime = ts;
  const E = Math.min(ts - startTime, T.TOTAL);
  const progress = E / T.TOTAL;

  /* ── Caméra frontale (léger bob + zoom) — pas d’orbite latérale ── */
  const camR = 8.5 - sub(E, T.CORE_APPEARS, T.SMOOTHING_START) * 1.5;
  camera.position.set(
    0,
    1.5 + Math.sin(progress * Math.PI * 2 * MOTION.CAM_BOB_CYCLES) * MOTION.CAM_BOB_AMP,
    camR
  );
  camera.lookAt(0, 0, 0);

  /* ── Étoiles : défilement gauche → droite, calibré sur 25 s ── */
  starField.rotation.y = -progress * MOTION.STAR_TURNS * Math.PI * 2;

  /* ── Badge + textes ── */
  if(E > T.TEXT1_IN)  show('l1');
  if(E > T.FORMULA_IN){ setF('formula', sub(E, T.FORMULA_IN, T.FORMULA_IN+1200)); }
  if(E > T.GRAVITY_START + 5000) setF('formula', 1 - sub(E, T.GRAVITY_START+5000, T.GRAVITY_START+6500));
  if(E > T.TEXT2_IN){ hide('l1'); show('l2'); }
  if(E > T.TEXT3_IN){ hide('l2'); show('l3'); }
  if(E > T.TEXT4_IN){ hide('l3'); show('l4'); }
  if(E > T.TEXT5_IN){ hide('l4'); show('l5'); }

  /* ── Lignes gravitationnelles ── */
  if(E > T.GRAV_LINES_IN){
    const gT = sub(E, T.GRAV_LINES_IN, T.GRAV_LINES_IN + 1800);
    gravLines.forEach((gl, i) => {
      const delay = (i / N_LINES) * .4;
      const t     = cl((gT - delay) / .6, 0, 1);
      gl.mat.opacity = ease(t) * .18;
    });
  }
  /* Fade out lignes quand sphère lisse */
  if(E > T.SMOOTHING_START + 2000){
    const fT = sub(E, T.SMOOTHING_START+2000, T.SMOOTHING_START+4000);
    gravLines.forEach(gl => { gl.mat.opacity *= (1 - fT); });
  }

  /* ── Phase gravité : fragments orbitent → tombent ── */
  if(E > T.GRAVITY_START){
    const gProg = cl((E - T.GRAVITY_START) / (T.CORE_APPEARS + 3000 - T.GRAVITY_START), 0, 1);
    const gravStrength = .0004 + ease(gProg) * .012;

    fragments.forEach(f => {
      if(!f.visible) return;
      /* Attraction vers centre */
      const toCenter = new THREE.Vector3().sub(f.position).normalize();
      const dist     = f.position.length();
      f._vel.addScaledVector(toCenter, gravStrength / Math.max(.3, dist * .3));
      /* Friction douce (perte d'énergie orbitale) */
      f._vel.multiplyScalar(.985);
      f.position.add(f._vel);
      /* Rotation propre */
      f.rotation.x += f._rotSpd.x;
      f.rotation.y += f._rotSpd.y;
      /* Opacité sur la fin */
      if(dist < .25){
        f.material.opacity = cl(dist / .25 - .1, 0, 1);
        if(dist < .12) f.visible = false;
      }
    });

    /* Noyau central grossit */
    const coreT = sub(E, T.CORE_APPEARS, T.CORE_APPEARS + 3000);
    sphereSize  = ease(coreT);
    centralMat.opacity = sub(E, T.CORE_APPEARS, T.CORE_APPEARS + 1200);
    haloMat.opacity    = sphereSize * .1;
    glowMat.opacity    = sub(E, T.CORE_APPEARS, T.CORE_APPEARS+800) * .6;

    /* Bosses s'effacent progressivement = gravité lisse la surface */
    if(E > T.SMOOTHING_START){
      bumpAmount = 1.0 - ease(cl((E - T.SMOOTHING_START) / 4500, 0, 1));
    }
    updateCentralSphere(bumpAmount, sphereSize);
    const spinP = ease(cl((E - T.CORE_APPEARS) / (T.TOTAL - T.CORE_APPEARS), 0, 1));
    centralMesh.rotation.y = spinP * MOTION.SPHERE_SPIN;
  } else {
    /* Phase 1 : fragments flottent avec inertie */
    fragments.forEach(f => {
      f.rotation.x += f._rotSpd.x * .5;
      f.rotation.y += f._rotSpd.y * .5;
    });
  }

  /* Glow intensité maximale au pic */
  if(E > T.GLOW_PEAK){
    const gT = sub(E, T.GLOW_PEAK, T.GLOW_PEAK + 1500);
    sun.intensity = 1.4 + gT * 1.8;
    centralMat.emissiveIntensity = .4 + gT * .8;
    centralMat.specular.setHSL(.6, .8, .3 + gT * .4);
  }

  if(E >= T.TOTAL) playing = false;

  renderer.render(scene, camera);
}

/* ════════════════════════════════════════════════
   API
════════════════════════════════════════════════ */
function playAnim(){
  if(playing) return;
  playing = true; startTime = null; lastFrame = 0;
  rafId = requestAnimationFrame(tick);
}

function resetAnim(){
  if(rafId) cancelAnimationFrame(rafId);
  playing = false; startTime = null; bumpAmount = 1.0; sphereSize = 0;
  prevBump = -1; prevSzKey = -1; cameraAngle = 0;
  fragments.forEach(f => {
    f.position.copy(f._origPos);
    f._vel.set(0,0,0);
    const d = f._origPos.clone().normalize();
    const up = new THREE.Vector3(0,1,0);
    const tan = new THREE.Vector3().crossVectors(d, up).normalize();
    const spd = (.012 + Math.random()*.018) * (Math.random()>.5?1:-1);
    f._vel.copy(tan.multiplyScalar(spd));
    f.visible = true; f.material.opacity = 1;
  });
  fragGroup.visible = true;
  centralMat.opacity = 0; haloMat.opacity = 0; glowMat.opacity = 0;
  centralMesh.scale.set(1,1,1); haloMesh.scale.set(1,.94,1);
  centralMesh.rotation.set(0, 0, 0);
  starField.rotation.set(0, 0, 0);
  cameraAngle = 0;
  camera.position.set(0, 1.5, 8.5);
  camera.lookAt(0, 0, 0);
  sun.intensity = 1.4; centralMat.emissiveIntensity = .4;
  updateCentralSphere(1.0, .001);
  gravLines.forEach(gl => { gl.mat.opacity = 0; });
  setF('formula', 0);
  ['l1','l2','l3','l4','l5'].forEach(hide);
  renderer.render(scene, camera);
}

window.GravitySphereAnim = {
  play()      { playAnim(); },
  reset()     { resetAnim(); },
  pause()     { paused = true; },
  resume()    { paused = false; },
  seek()      {},
  isPlaying() { return playing && !paused; }
};

window.addEventListener('message', e => {
  if(e.data==='play')   playAnim();
  if(e.data==='pause')  paused = true;
  if(e.data==='resume') paused = false;
  if(e.data==='reset')  resetAnim();
});

document.addEventListener('visibilitychange', () => { paused = document.hidden; });

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

renderer.render(scene, camera);
resetAnim();
</script>
</body>
</html>
