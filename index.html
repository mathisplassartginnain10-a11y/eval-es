<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var host = location.hostname;
      var path = location.pathname.replace(/\/index\.html?$/i, "");
      if (!path.endsWith("/")) path += "/";
      if (path === "//") path = "/";
      var local = host === "localhost" || host === "127.0.0.1" || host === "[::1]";
      if (local && /^\/eval-es\//.test(path)) path = "/";
      var b = document.createElement("base");
      b.href = path;
      document.head.appendChild(b);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>La Terre est-elle ronde ? — Exposé ES</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;1,14..32,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "gsap": "https://esm.sh/gsap@3.12.5",
      "gsap/ScrollTrigger": "https://esm.sh/gsap@3.12.5/ScrollTrigger",
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app" data-layout="intro">
    <div class="nebula-bg" aria-hidden="true"></div>

    <header class="intro-page-meta" aria-label="Crédits de l’exposé">
      <p class="intro-page-meta__credits">Réalisé par : Mathis PLASSART GINNAIN et Maximilien FAVRE</p>
      <p class="intro-page-meta__subject">Exposé ES</p>
    </header>

    <!-- Média uniquement dans la moitié droite (le texte reste à gauche, z-index plus haut) -->
    <div class="stage-media-wrap" id="stage-media-wrap" aria-hidden="true">
      <!-- Intro : une seule scène WebGL (3 globes) — iPad / Safari -->
      <div id="intro-clips-wrap" class="intro-clips-wrap intro-clips-wrap--unified" hidden aria-hidden="true">
        <div class="intro-clip intro-clip--unified">
          <iframe
            id="three-globes-frame"
            class="intro-clip-frame"
            title="Les trois Terres — sphère, aplatie, cône"
            data-src="docs/prompts/three-globes.html"
          ></iframe>
          <div class="intro-clip-swipe-rail intro-clip-swipe-rail--start" aria-hidden="true"></div>
          <div class="intro-clip-swipe-rail intro-clip-swipe-rail--end" aria-hidden="true"></div>
        </div>
      </div>
      <div class="stage-single" id="stage-single" hidden>
        <video
          id="stage-video"
          class="stage-video"
          aria-label="Vidéo de l’exposé"
          muted
          playsinline
        ></video>
        <img id="stage-image" class="stage-image" alt="" hidden decoding="async" />
        <div id="stage-sphere-host" class="stage-sphere-host" hidden aria-hidden="true"></div>
      </div>
      <div class="stage-tiles" id="stage-tiles">
        <div class="stage-tile">
          <video class="stage-tile-video" muted playsinline aria-hidden="true"></video>
          <img class="stage-tile-image" alt="" hidden decoding="async" />
        </div>
        <div class="stage-tile">
          <video class="stage-tile-video" muted playsinline aria-hidden="true"></video>
          <img class="stage-tile-image" alt="" hidden decoding="async" />
        </div>
        <div class="stage-tile">
          <video class="stage-tile-video" muted playsinline aria-hidden="true"></video>
          <img class="stage-tile-image" alt="" hidden decoding="async" />
        </div>
      </div>
      <div id="erato-prompt-wrap" class="erato-prompt-wrap" hidden aria-hidden="true">
        <iframe
          id="erato-prompt-frame"
          class="erato-prompt-frame"
          title="Animation Ératosthène"
          src="docs/prompts/eratosthene-animation.html"
          loading="lazy"
        ></iframe>
        <div class="erato-swipe-rail erato-swipe-rail--start" aria-hidden="true"></div>
        <div class="erato-swipe-rail erato-swipe-rail--end" aria-hidden="true"></div>
      </div>
      <!-- Animation puits : affichée à l’étape 2 (index KEYFRAMES 1), voir src/sections.js -->
      <div id="puits-stage-wrap" class="puits-stage-wrap" hidden aria-hidden="true">
        <div id="puits-scroll-scroller" class="puits-scroll-scroller">
          <section id="section-puits" class="section-puits" aria-label="Animation puits">
            <div class="section-puits__sticky">
              <iframe
                id="puits-prompt-frame"
                class="puits-prompt-frame"
                title="Animation puits"
                src="docs/prompts/puits-animation.html"
                scrolling="no"
              ></iframe>
            </div>
          </section>
        </div>
      </div>
    </div>

    <div class="progress-track" aria-hidden="true">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <nav class="section-dots" id="section-dots" aria-label="Sections de l'exposé"></nav>

    <div class="text-overlay text-overlay--apple is-visible" id="text-overlay">
      <p class="text-overlay__kicker" id="text-kicker"></p>
      <h1 class="text-overlay__title" id="text-title"></h1>
      <p class="text-overlay__subtitle" id="text-subtitle" hidden></p>
      <div class="text-overlay__body" id="text-body"></div>
      <p class="text-overlay__credit" id="text-credit" hidden></p>
    </div>

    <div class="app-status-bar" aria-label="Navigation de l’exposé">
      <p class="section-label step-label" id="section-label" aria-live="polite" aria-atomic="true"></p>
      <p class="step-indicator step-label step-label--muted" id="step-indicator" aria-live="polite" aria-atomic="true"></p>
    </div>
  </div>

  <div id="scroll-root" class="scroll-root"></div>

  <iframe
    id="intro-stars-frame"
    class="intro-stars-frame"
    title="Introduction — fond étoilé"
    src="docs/prompts/intro-stars.html"
  ></iframe>
  <div id="persistent-names" class="persistent-names" aria-hidden="true">
    Mathis PLASSART GINNAIN<br />
    Maximilien FAVRE
  </div>
  <p id="scroll-hint" class="scroll-hint-intro" aria-hidden="true">Défiler</p>

  <script>
    (function () {
      const iframeObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            const iframe = entry.target;
            if (!(iframe instanceof HTMLIFrameElement)) return;
            const ds = iframe.dataset.src;
            if (!ds) return;
            if (!iframe.src || iframe.src === "about:blank") {
              iframe.src = ds;
            }
            iframeObserver.unobserve(iframe);
          });
        },
        { rootMargin: "400px" }
      );

      const pauseObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            const iframe = entry.target;
            if (!(iframe instanceof HTMLIFrameElement) || !iframe.contentWindow) return;
            iframe.contentWindow.postMessage(entry.isIntersecting ? "resume" : "pause", "*");
          });
        },
        { threshold: 0.1 }
      );

      function wireIntroIframes() {
        document.querySelectorAll("#intro-clips-wrap iframe[data-src]").forEach((f) => {
          iframeObserver.observe(f);
          pauseObserver.observe(f);
        });
      }

      function wireThreeGlobesNavSync() {
        const threeGlobesFrame = document.getElementById("three-globes-frame");
        window.addEventListener("message", (e) => {
          if (e.data !== "intro-complete") return;
          if (!(threeGlobesFrame instanceof HTMLIFrameElement)) return;
          if (!threeGlobesFrame.contentWindow || e.source !== threeGlobesFrame.contentWindow) return;
          const nav = document.getElementById("section-dots");
          if (nav) nav.setAttribute("data-globes-intro", "complete");
          nav?.querySelector(".section-dot")?.classList.add("section-dot--globes-intro-complete");
        });
      }

      function wireIntroAndGlobesNav() {
        wireIntroIframes();
        wireThreeGlobesNavSync();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", wireIntroAndGlobesNav);
      } else {
        wireIntroAndGlobesNav();
      }
    })();
  </script>

  <!-- ?v= incrémente si le navigateur garde une vieille copie de sections.js (ex. ancien nom de vidéo). -->
  <script type="module" src="./main.js"></script>
</body>
</html>
